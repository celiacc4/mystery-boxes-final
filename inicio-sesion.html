<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mystery Boxes - Iniciar sesión</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">
    <link rel="manifest" href="icon/site.webmanifest">
</head>

<body>

    <header class="cabecera">
        <nav class="navegacion">

            <a href="index.html" class="marca">
                <img src="img/logo.webp" alt="Logo Mystery Box Store">
                <span>
                    <strong>Mystery Box Store</strong>
                </span>
            </a>

            <div class="enlaces">
                <a href="index.html">Inicio</a>
                <a href="productos.html">Productos</a>
                <a href="simulador.html">Abre tu caja</a>
                <a href="index.html#como-funciona">Cómo funciona</a>
                <a href="index.html#contacto">Contacto</a>
            </div>

            <div class="iconos">
                <a aria-label="Carrito">
                    <img src="img/carrito.webp" alt="Carrito">
                </a>

                <a href="inicio-sesion.html" aria-label="Usuario" aria-current="page">
                    <img src="img/usuario.webp" alt="Usuario">
                </a>
            </div>

        </nav>
    </header>

    <main class="pagina-acceso">
        <div class="container">

            <h1>Iniciar sesión</h1>

            <div class="card tarjeta-acceso">
                <div class="card-body p-4 p-md-5">

                    <form class="needs-validation" id="form-login" novalidate>

                        <div class="mb-3">
                            <label for="login-email" class="form-label">Correo electrónico</label>
                            <input type="email" class="form-control" id="login-email" name="email" autocomplete="email" required>
                            <div class="invalid-feedback">Introduce un correo electrónico válido.</div>
                        </div>

                        <div class="mb-3">
                            <label for="login-password" class="form-label">Contraseña</label>
                            <input type="password" class="form-control" id="login-password" name="password" autocomplete="current-password" required>
                            <div class="invalid-feedback">Introduce tu contraseña.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="login-recordar" name="recordar">
                                <label class="form-check-label" for="login-recordar">Recordarme</label>
                            </div>
                            <a href="#" class="enlace-acceso">¿Olvidaste tu contraseña?</a>
                        </div>

                        <button type="submit" class="boton amarillo w-100">Iniciar sesión</button>

                    </form>

                    <p class="texto-cambio">
                        ¿Aún no tienes cuenta?
                        <a href="registro.html" class="enlace-acceso">Regístrate</a>
                    </p>



                </div>
            </div>

        </div>
    </main>

    <footer class="pie">
        <p><a href="https://example.com">Mystery-Boxes</a> © 2026 by <a href="https://example.com">Celia Cosano Carmona</a> is licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a><img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/nc.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"><img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="" style="max-width: 1em;max-height:1em;margin-left: .2em;"></p>
    </footer>

    <!-- MODAL DE AVISOS: se rellena desde JavaScript con mostrarAviso() -->
    <div class="modal fade" id="modal-aviso" tabindex="-1" aria-labelledby="modal-aviso-titulo" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content tarjeta-modal">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-aviso-titulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body" id="modal-aviso-texto"></div>
                <div class="modal-footer">
                    <button type="button" class="boton amarillo" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/aviso.js"></script>
    <script>
        (() => {
            'use strict';

            const formulario = document.getElementById('form-login');

            formulario.addEventListener('submit', (event) => {
                event.preventDefault();

                if (!formulario.checkValidity()) {
                    event.stopPropagation();
                } else {
                    // Aquí iría la llamada al servidor. De momento solo se muestra un aviso.
                    mostrarAviso('Inicio de sesión', 'Los datos son válidos, pero todavía no hay servidor conectado, así que no se ha iniciado ninguna sesión.');
                }

                formulario.classList.add('was-validated');
            });
        })();
    </script>

</body>

</html>
